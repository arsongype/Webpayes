[project]
name = "paysmart-ai-engine"
version = "0.1.0"
description = "AI Engine for fraud detection and dynamic routing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "redis>=5.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["watchfiles>=0.5.0"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8001
