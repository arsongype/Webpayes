spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

logging:
  level:
    com.paymentplatform: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
