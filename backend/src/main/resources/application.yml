spring:
  application:
    name: payment-platform-backend

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monorepo_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:arson}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
            scope:
              - email
              - profile

  ai:
    fraud-detection:
      url: ${AI_FRAUD_DETECTION_URL:http://localhost:8001}
    risk-scoring:
      url: ${AI_RISK_SCORING_URL:http://localhost:8002}
    kyc:
      url: ${AI_KYC_URL:http://localhost:8003}
    chatbot:
      url: ${AI_CHATBOT_URL:http://localhost:8004}
    recommendation:
      url: ${AI_RECOMMENDATION_URL:http://localhost:8005}
    routing:
      url: ${AI_ROUTING_URL:http://localhost:8006}

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:changeme_dev_secret_please_override_in_prod_min_32_chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.paymentplatform: DEBUG
    org.springframework.security: INFO
