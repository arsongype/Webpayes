spring:
  application:
    name: payment-platform-backend

  jmx:
    enabled: false

  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus,metrics,caches,scheduledtasks
    endpoint:
      health:
        show-details: when_authorized
    metrics:
      tags:
        application: ${spring.application.name}
        environment: ${APP_ENV:dev}
    tracing:
      sampling:
        probability: ${TRACING_SAMPLE_RATE:1.0}
      enabled: ${TRACING_ENABLED:true}
    otlp:
      tracing:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
        timeout: 10s
      metrics:
        endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        enabled: ${OTLP_METRICS_ENABLED:false}
        step: 30s

  thymeleaf:
    check-template-location: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monorepo_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:arson}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
            scope:
              - email
              - profile

ai:
  kyc:
    url: ${AI_KYC_URL:http://127.0.0.1:8001}
  fraud-detection:
    url: ${AI_FRAUD_DETECTION_URL:http://127.0.0.1:8001}
  risk-scoring:
    url: ${AI_RISK_SCORING_URL:http://127.0.0.1:8001}
  routing:
    url: ${AI_ROUTING_URL:http://127.0.0.1:8001}

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:changeme_dev_secret_please_override_in_prod_min_32_chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.paymentplatform: DEBUG
    org.springframework.security: INFO

# --- Payment Gateway Configuration ---
payment:
  gateway:
    mode: ${PAYMENT_GATEWAY_MODE:mock}
    stripe:
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    orange-money:
      api-url: ${ORANGE_MONEY_API_URL:https://api.orange.com}
      client-id: ${ORANGE_MONEY_CLIENT_ID:}
      client-secret: ${ORANGE_MONEY_CLIENT_SECRET:}
      merchant-key: ${ORANGE_MONEY_MERCHANT_KEY:}
    mock:
      simulate-success: ${MOCK_PAYMENT_SUCCESS:true}

  fraud:
    block-threshold: ${PAYMENT_FRAUD_BLOCK_THRESHOLD:0.85}
    challenge-threshold: ${PAYMENT_FRAUD_CHALLENGE_THRESHOLD:0.40}
