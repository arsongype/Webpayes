# Canonical local/dev stack for the Payment Online Platform.
# Usage:  docker compose -f infra/docker-compose/docker-compose.yml up --build
# From repo root you can also run:  docker compose -f infra/docker-compose/docker-compose.yml up --build
#
# Note: All AI capabilities (fraud detection, risk scoring, KYC verification, 3DS2 exemption,
#       dynamic routing) are exposed by a single FastAPI service: ai-engine (port 8001).
#       The 6 legacy microservices (fraud-detection, risk-scoring, kyc-verification,
#       chatbot, recommendation, routing-engine) have been consolidated into ai-engine.

name: payment-online

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-payment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payment}
      POSTGRES_DB: ${DB_NAME:-paymentplatform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-payment} -d ${DB_NAME:-paymentplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ai-engine:
    build:
      context: ../../ai-engine
      dockerfile: ../../ai-engine/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ../../backend
      dockerfile: ../../infra/docker/backend.Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-paymentplatform}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-payment}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-payment}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_please_override_in_prod_min_32_chars}
      JWT_EXPIRATION_MS: 86400000
      AI_FRAUD_DETECTION_URL: http://ai-engine:8001
      AI_RISK_SCORING_URL: http://ai-engine:8001
      AI_KYC_URL: http://ai-engine:8001
      AI_CHATBOT_URL: http://ai-engine:8001
      AI_RECOMMENDATION_URL: http://ai-engine:8001
      AI_ROUTING_URL: http://ai-engine:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8081/api
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  ollama_data:
  grafana_data:
