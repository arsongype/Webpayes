apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: payment-platform
  labels:
    app: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: payment-online/chatbot:1.0.0
          ports:
            - containerPort: 8004
          env:
            - name: PORT
              value: "8004"
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-platform-config
                  key: OLLAMA_BASE_URL
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: payment-platform
  labels:
    app: chatbot
spec:
  selector:
    app: chatbot
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP
