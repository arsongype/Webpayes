apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  namespace: payment-platform
  labels:
    app: ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engine
  template:
    metadata:
      labels:
        app: ai-engine
    spec:
      containers:
        - name: ai-engine
          image: payment-online/ai-engine:1.0.0
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-platform-config
                  key: OLLAMA_BASE_URL
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine
  namespace: payment-platform
  labels:
    app: ai-engine
spec:
  selector:
    app: ai-engine
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
