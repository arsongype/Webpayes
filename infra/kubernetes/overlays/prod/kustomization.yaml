apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payment-platform
namePrefix: prod-

commonLabels:
  env: prod

resources:
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/secrets.yaml
  - ../../database/postgres-pvc.yaml
  - ../../database/postgres-statefulset.yaml
  - ../../backend/deployment.yaml
  - ../../backend/service.yaml
  - ../../backend/hpa.yaml
  - ../../ai-engine/deployment.yaml
  - ../../frontend/deployment.yaml
  - ../../frontend/service.yaml
  - ../../frontend/ingress.yaml
  - production.yaml
  - observability.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: backend
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 20
