---
# PCI-DSS, GDPR, observability
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-backend-netpol
  namespace: payment-platform
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: ai-engine
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4318
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prod-backend-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-audit-policy
  namespace: payment-platform
data:
  audit-retention-days: "2555"
  audit-hash-algorithm: "SHA-256"
  audit-immutable: "true"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-payment-platform
  namespace: payment-platform
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; frame-ancestors 'none'";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.payments.example.com
        - app.payments.example.com
      secretName: prod-payment-platform-tls
  rules:
    - host: api.payments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-backend
                port:
                  number: 8081
    - host: app.payments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-frontend
                port:
                  number: 80
