spring:
  application:
    name: shopease-backend
  datasource:
    url: jdbc:h2:mem:shopease;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: shopease-dev-secret-key-minimum-256-bits-long-for-hs256-algorithm
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: WARN
